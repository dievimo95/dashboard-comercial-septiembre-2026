name: Repair Fill Rate matching

on:
  push:
    paths:
      - '.github/workflows/fix-fill-rate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Fill Rate repair
        run: python .github/scripts/fix_fill_rate.py

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit application change
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "fix: repair Fill Rate order matching"
          git push
