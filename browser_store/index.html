<!doctype html>
<html lang="es">
<head><meta charset="utf-8"></head>
<body style="margin:0;height:0;overflow:hidden">
<script>
  let lastRequest = null;

  function send(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      dataType: "json",
      value: value
    }, "*");
  }

  window.addEventListener("message", (event) => {
    if (event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    const storageKey = args.storage_key || "control-comercial-corte-v1";
    const fallbackKey = args.fallback_key || "";
    const request = `${storageKey}:${args.action || "load"}:${args.revision || ""}`;
    if (request === lastRequest) return;
    lastRequest = request;
    try {
      if (args.action === "save") {
        localStorage.setItem(storageKey, args.payload);
        send({ action: "saved", revision: args.revision });
      } else if (args.action === "clear") {
        localStorage.removeItem(storageKey);
        send({ action: "cleared", revision: args.revision });
      } else {
        const primaryPayload = localStorage.getItem(storageKey);
        const fallbackPayload = !primaryPayload && fallbackKey ? localStorage.getItem(fallbackKey) : null;
        send({
          action: "loaded",
          payload: primaryPayload || fallbackPayload,
          source: primaryPayload ? "primary" : (fallbackPayload ? "fallback" : "empty")
        });
      }
    } catch (error) {
      send({ action: "error", message: String(error) });
    }
  });

  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: 0
  }, "*");
</script>
</body>
</html>
